---
deployment:
  tasks:
    - export BRANCH=$(/usr/bin/git rev-parse --abbrev-ref HEAD)
    - if [ "$BRANCH" = "main" ]; then export SITE_ROOT=/home/rekultur/boxara.rs; else export SITE_ROOT=/home/rekultur/staging.boxara.rs; fi
    - export DEPLOYPATH=$SITE_ROOT/wp-content/themes/boxara/
    - if [ -z "$SITE_ROOT" ]; then echo "SITE_ROOT empty, aborting"; exit 1; fi
    - /bin/mkdir -p $DEPLOYPATH
    - /usr/bin/rsync -a --delete --exclude '.git' --exclude '.cpanel.yml' --exclude '.gitignore' --exclude '.claude' ./ $DEPLOYPATH
